services:
  postgres:
    image: postgres:16-alpine
    container_name: toyamas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: toyamas
      POSTGRES_PASSWORD: toyamas_secret
      POSTGRES_DB: toyamas_cloud
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toyamas -d toyamas_cloud"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: toyamas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
